# Infraestructura local de Lectio: PostgreSQL y Redis (colas de BullMQ).
#   docker compose up -d     levanta ambos servicios
#   docker compose down      los detiene (los datos quedan en los volúmenes)
#   docker compose down -v   los detiene y borra los datos
# Solo escuchan en 127.0.0.1: no quedan expuestos a la red local.

name: lectio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lectio
      POSTGRES_PASSWORD: lectio
      POSTGRES_DB: lectio
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea también la base de los tests de integración (lectio_test).
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lectio -d lectio']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # BullMQ exige que Redis no descarte claves de las colas por falta de memoria.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
